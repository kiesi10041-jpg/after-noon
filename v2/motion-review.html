<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12:00 작업 모션 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#142219;color:#eee4c9;font:16px system-ui;display:grid;place-items:center;min-height:100dvh;padding:20px}main{width:min(520px,100%);background:#213027;border:1px solid #7d8a6b;border-radius:12px;padding:20px}h1{font-size:22px;margin:0 0 14px}select,button{font:inherit;color:inherit;background:#344636;border:1px solid #8b9477;border-radius:5px;padding:10px;min-height:44px}select{width:100%}canvas{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#213027}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}input{width:100%;margin:16px 0;accent-color:#c5c291}p{line-height:1.5;color:#c8c9b1}.status{font-variant-numeric:tabular-nums}a{color:#e5ddb6}</style><main><h1>12:00 · 작업 모션 검수</h1><select aria-label="작업 선택"></select><canvas width="384" height="384" aria-label="작업 모션 미리보기"></canvas><input type="range" min="0" max="95" step="1" value="0" aria-label="프레임"><nav><button id="previous">이전 동작</button><button id="play">재생</button><button id="next">다음 동작</button></nav><p class="status" role="status">로딩 중</p><p>슬라이더를 움직여 여는 과정과 닫는 과정, 손과 소품의 연결을 확인할 수 있습니다.</p><a href="./">게임으로 돌아가기</a></main><script type="module">
import{motionKinds,motionFrames,motionFrameMs,preloadMotion,drawMotionFrame}from'./work-motion.js?v=0.36.0';
const names={drawer:'서랍 열기·내부 확인·닫기',books:'책장 조사',medical:'의약품 조사',retail:'식품 진열대 조사',tools:'공구 조사',vehicle:'차량 짐 조사',rubble:'잔해 조사',observe:'주변 살피기',eat:'식사',drink:'물 마시기',sleep:'잠자리에서 수면',rest:'앉아서 휴식',repair:'장비 수리',sew:'가방 바느질',garden:'화분에 물주기',care:'먹이 주기',bike:'자전거 타기',read:'책 읽기',treat:'붕대 감기',fill:'수돗물 받기',cook:'조리',plant:'씨앗 심기',harvest:'잎채소 수확', 'bike-repair':'자전거 체인 정비',build:'거처 보강'};
const select=document.querySelector('select'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false}),slider=document.querySelector('input'),status=document.querySelector('.status');let kind='drawer',image,playing=false,elapsed=0,last=0,token=0;
for(const k of motionKinds){const o=document.createElement('option');o.value=k;o.textContent=names[k];select.append(o);}async function load(){const id=++token;playing=false;kind=select.value;status.textContent='로딩 중';const current=await preloadMotion(kind);if(id!==token)return;image=current;elapsed=0;slider.value=0;paint();}function paint(){if(!image)return;drawMotionFrame(ctx,image,elapsed,kind,384);status.textContent=names[kind]+' · 원화 16장 · 프레임 '+(Math.min(95,Math.floor(elapsed/motionFrameMs(kind)))+1)+'/96';document.querySelector('#play').textContent=playing?'일시 정지':'재생';}select.onchange=load;slider.oninput=()=>{playing=false;elapsed=Number(slider.value)*motionFrameMs(kind);paint();};document.querySelector('#play').onclick=()=>{if(!image)return;if(elapsed>=95*motionFrameMs(kind))elapsed=0;playing=!playing;paint();};for(const [id,d]of[['previous',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{select.selectedIndex=(select.selectedIndex+d+motionKinds.length)%motionKinds.length;void load();};function tick(now){if(playing&&document.visibilityState==='visible'){elapsed=Math.min(95*motionFrameMs(kind),elapsed+Math.min(100,now-last));slider.value=String(Math.floor(elapsed/motionFrameMs(kind)));if(elapsed>=95*motionFrameMs(kind))playing=false;paint();}last=now;requestAnimationFrame(tick);}void load();requestAnimationFrame(tick);
</script></html>
