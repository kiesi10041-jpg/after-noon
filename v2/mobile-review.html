<!doctype html><html lang="ko"><meta charset="utf-8"><title>모바일 화면 검수</title><style>body{margin:0;background:#101814;display:grid;justify-items:center;align-content:center;gap:12px;min-height:100vh;color:#eee;font:16px sans-serif}nav{display:flex;gap:8px}button{padding:10px 16px;background:#344537;color:#fff;border:1px solid #a4af8d;border-radius:5px;min-height:44px}iframe{width:390px;height:780px;border:1px solid #809079;border-radius:12px}</style><nav aria-label="검수 너비"><button data-width="320">320px</button><button data-width="360">360px</button><button data-width="390">390px</button></nav><iframe title="모바일 게임 검수" src="./?qa=1&amp;rev=0.16.0"></iframe><script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{const f=document.querySelector("iframe");f.style.width=b.dataset.width+"px";f.style.height=(b.dataset.width==="320"?640:780)+"px"})</script></html>
